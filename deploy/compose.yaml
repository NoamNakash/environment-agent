# Standalone agent compose stack.
#
# Default (`make compose-up`): environment-agent only — set AGENT_MESSAGING_URL in deploy/.env
# to reach control-plane NATS (e.g. nats://host.docker.internal:4222).
#
# With bundled NATS (`make compose-up-with-nats` or --profile nats): also starts NATS + nats-init.
# Set AGENT_MESSAGING_URL=nats://nats:4222 in deploy/.env when using the nats profile.
#
# For control-plane + agent on one stack, see the control-plane deploy repo.

x-agent-common: &agent-common
  AGENT_NAME: ${AGENT_NAME:-local-agent}
  AGENT_ENVIRONMENT: ${AGENT_ENVIRONMENT:-main}
  AGENT_COST: ${AGENT_COST:-low}
  # Base URL only — the agent appends /api/v1alpha1/agents for registration.
  DCM_REGISTRATION_URL: ${DCM_REGISTRATION_URL:-http://host.docker.internal:8080}
  AGENT_MESSAGING_URL: ${AGENT_MESSAGING_URL:-nats://host.docker.internal:4222}
  AGENT_EMBEDDED_SPS: ${AGENT_EMBEDDED_SPS}
  SP_DEFAULT_KUBECONFIG: /kubeconfig
  SP_CONTAINER_NAMESPACE: ${SP_CONTAINER_NAMESPACE:-default}
  SP_K8S_EXTERNAL_SVC_TYPE: ${SP_K8S_EXTERNAL_SVC_TYPE:-NodePort}
  SP_VM_NAMESPACE: ${SP_VM_NAMESPACE:-default}
  SP_CLUSTER_NAMESPACE: ${SP_CLUSTER_NAMESPACE:-}
  SP_PULL_SECRET: ${SP_PULL_SECRET:-}
  SP_BASE_DOMAIN: ${SP_BASE_DOMAIN:-}
  SP_STORAGE_NAMESPACE: ${SP_STORAGE_NAMESPACE:-default}
  SP_K8S_DEFAULT_STORAGE_CLASS: ${SP_K8S_DEFAULT_STORAGE_CLASS:-}
  SP_K8S_DEFAULT_ACCESS_MODE: ${SP_K8S_DEFAULT_ACCESS_MODE:-ReadWriteOnce}
  SP_NETWORK_NAMESPACE: ${SP_NETWORK_NAMESPACE:-default}
  # Shared by container, storage, and network SPs — one value applies to every
  # enabled provider that reads each variable.
  SP_MONITOR_DEBOUNCE_MS: ${SP_MONITOR_DEBOUNCE_MS:-500}
  SP_MONITOR_RESYNC_PERIOD: ${SP_MONITOR_RESYNC_PERIOD:-10m}
  SP_MONITOR_PUBLISH_MAX_ATTEMPTS: ${SP_MONITOR_PUBLISH_MAX_ATTEMPTS:-5}
  AGENT_SP_PERSISTENCE_PATH: /app/data/registrations.json

x-nats-init-script: &nats-init-script |
  wait_for_nats() {
    i=0
    while [ "$$i" -lt 60 ]; do
      if nats --server nats://nats:4222 server check connection >/dev/null 2>&1; then
        return 0
      fi
      i=$$((i + 1))
      sleep 1
    done
    echo "NATS not ready after 60s" >&2
    return 1
  }
  ensure() {
    nats --server nats://nats:4222 stream info "$$1" >/dev/null 2>&1 && return 0
    echo "Creating JetStream stream $$1 (subjects: $$2)"
    nats --server nats://nats:4222 stream add "$$1" \
      --subjects "$$2" --storage file --retention "$$3" \
      --discard old --max-age 72h --defaults
  }
  wait_for_nats
  ensure dcm-agent-requests 'dcm.agent.>' limits
  ensure dcm-status 'dcm.*' limits
  ensure dcm-agent-responses dcm.agents.responses work

services:
  nats:
    profiles: ["nats"]
    image: docker.io/library/nats:2-alpine
    command: ["--jetstream", "--store_dir=/data", "-m", "8222"]
    ports:
      - "4222:4222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  nats-init:
    profiles: ["nats"]
    image: docker.io/natsio/nats-box:0.14.3
    depends_on:
      nats:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - *nats-init-script

  environment-agent:
    build:
      context: ..
      dockerfile: Containerfile
    image: quay.io/dcm-project/environment-agent:${ENVIRONMENT_AGENT_VERSION:-main}
    pull_policy: missing
    environment:
      <<: *agent-common
    ports:
      - "${AGENT_PORT:-8081}:8080"
    volumes:
      - ${AGENT_KUBECONFIG_HOST:-.kube/config}:/kubeconfig:ro
      - agent_data:/app/data
    depends_on:
      nats:
        condition: service_healthy
        required: false
      nats-init:
        condition: service_completed_successfully
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  nats_data: {}
  agent_data: {}
